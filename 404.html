<style>
:root{--bg:#f3f5f8;--ink:#18202e;--muted:#5b6577;--accent:#2b4bd6;color-scheme:light}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.55 Inter,system-ui,sans-serif;padding:24px 16px}
main{max-width:520px;text-align:center}
h1{font:800 clamp(30px,7vw,44px)/1.1 Archivo,system-ui,sans-serif;margin:0 0 14px}
p{color:var(--muted);margin:0 0 26px}
a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:15px 26px;border-radius:14px}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.alt{display:block;margin-top:18px;color:var(--muted)}
</style>
</head>
